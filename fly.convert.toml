# Fly.io config for the PresentFlow document converter (PPTX/PPT → PDF).
# Deploy with the driver:  ./scripts/deploy.sh convert
#
# Runs scripts/convert-server.ts as a Node process on port 3002. Unlike the
# audio bridge, this scales to ZERO when idle (auto_stop_machines = "stop",
# min_machines_running = 0) — conversions are bursty and infrequent, so an idle
# converter costs nothing; Fly cold-starts it on the next request (~1-2s).
#
# The Next app reaches it at https://faithflow-convert.fly.dev and authenticates
# every /convert with the CONVERT_SHARED_SECRET set as a Fly secret (and the
# matching CONVERT_SERVICE_URL + CONVERT_SHARED_SECRET env vars on Vercel).

app = "faithflow-convert"
primary_region = "lhr"     # co-located with the audio bridge + demo cohort
kill_signal = "SIGTERM"
kill_timeout = 30          # let an in-flight LibreOffice conversion finish

[build]
  dockerfile = "Dockerfile.convert"

[env]
  NODE_ENV = "production"
  CONVERT_PORT = "3002"

[http_service]
  internal_port = 3002
  force_https = true
  auto_stop_machines = "stop"    # scale to zero when idle
  auto_start_machines = true     # cold-start on the next request
  min_machines_running = 0

  [http_service.http_options]
    # A conversion streams ZERO response bytes until the whole PDF is ready, so
    # idle_timeout must cover the full conversion — otherwise the proxy drops
    # the connection mid-convert. Aligned with the caller's Vercel maxDuration
    # (/api/pptx/to-pdf = 300s); keep the three numbers in lockstep.
    idle_timeout = 300

  [[http_service.checks]]
    method = "get"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  # LibreOffice needs meaningfully more RAM than the audio bridge (512MB is not
  # enough — it OOM-kills on real decks). 2GB is a safe floor.
  cpu_kind = "shared"
  cpus = 2
  memory_mb = 2048
