name: Release desktop app (Windows)

# Dedicated Windows build — kept SEPARATE from release-desktop.yml (macOS) on
# purpose, so cutting a Windows installer NEVER rebuilds or clobbers the macOS
# release/DMG. Trigger manually (workflow_dispatch) with the version to attach
# to, or on a `win-v*` tag.
#
# Builds the Electron shell for Windows x64 as an UNSIGNED NSIS installer (.exe)
# and uploads it + the Windows auto-update manifest (latest.yml) to the matching
# GitHub Release. The .exe is the THIN CLIENT — it loads the hosted Vercel app,
# so it is 1:1 with the macOS build by construction. Unsigned → first launch
# shows a SmartScreen "More info -> Run anyway" prompt; installs + runs normally.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build + attach to the v<version> release (e.g. 0.1.230). Blank = package.json version."
        required: false
      dry_run:
        description: "Build + verify only; upload the installer as a workflow artifact instead of touching the release."
        type: boolean
        default: false
  push:
    tags:
      - "win-v*.*.*"

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-win:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Sync version (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.version != ''
        run: npm version "${{ github.event.inputs.version }}" --no-git-tag-version

      # NDI: the license-gated SDK isn't in the repo. Download NDI's own installer,
      # install it silently (Inno Setup), and build both native addons against
      # Electron's ABI. HARD FAIL if either addon is missing — a Windows installer
      # without NDI must never be published (installs would auto-update into it
      # and silently lose NDI audio in / video out).
      - name: Install NDI 6 SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Join-Path $env:RUNNER_TEMP "NDI6SDK.exe"
          Invoke-WebRequest -Uri "https://downloads.ndi.tv/SDK/NDI_SDK/NDI%206%20SDK.exe" -OutFile $exe
          $p = Start-Process -FilePath $exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-" -Wait -PassThru
          Write-Host "NDI SDK installer exit code: $($p.ExitCode)"
          $sdk = "C:\Program Files\NDI\NDI 6 SDK"
          if (-not (Test-Path "$sdk\Lib\x64\Processing.NDI.Lib.x64.lib")) {
            Get-ChildItem "C:\Program Files\NDI" -ErrorAction SilentlyContinue | Format-List FullName
            throw "NDI 6 SDK not found at $sdk after install"
          }

      - name: Build NDI native addons
        shell: pwsh
        run: |
          npm run ndi:rebuild:win
          foreach ($f in @("native\ndi-receiver\build\Release\ndi_receiver.node", "native\ndi-sender\build\Release\ndi_sender.node")) {
            if (-not (Test-Path $f)) { throw "NDI addon missing: $f" }
          }

      - name: Compile Electron main
        run: npm run electron:build:tsc

      - name: Build Windows NSIS installer (unsigned)
        # No CSC_* / signing cert — electron-builder produces an unsigned
        # installer. Intentional for the pilot (SmartScreen "Run anyway").
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Verify NDI is packaged
        shell: pwsh
        run: |
          $base = "release\win-unpacked\resources\native"
          foreach ($f in @("ndi-receiver\build\Release\ndi_receiver.node", "ndi-receiver\build\Release\Processing.NDI.Lib.x64.dll", "ndi-sender\build\Release\ndi_sender.node", "ndi-sender\build\Release\Processing.NDI.Lib.x64.dll")) {
            if (-not (Test-Path (Join-Path $base $f))) { throw "Packaged NDI file missing: $f" }
          }
          Write-Host "NDI packaged OK"

      - name: Upload installer as workflow artifact (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          name: presentflow-windows-installer
          path: |
            release/*.exe
            release/latest.yml
          retention-days: 7

      - name: Upload installer + latest.yml to the release
        if: "!(github.event_name == 'workflow_dispatch' && inputs.dry_run)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"

          # Attach to the existing macOS release for this version; create it if
          # this Windows build is the first artifact for the tag.
          # `|| true` so a concurrent macOS run creating the tag first can't
          # abort this job under `set -e`.
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --generate-notes || true

          echo "→ release artifacts:"
          ls -lh release/*.exe release/latest.yml || { echo "::error::Windows artifacts missing"; ls -la release || true; exit 1; }

          # Artifact is PresentFlow-Setup-<ver>.exe (no spaces); glob catches it.
          gh release upload "$TAG" release/*.exe --clobber
          gh release upload "$TAG" release/*.exe.blockmap --clobber || true
          gh release upload "$TAG" release/latest.yml --clobber
