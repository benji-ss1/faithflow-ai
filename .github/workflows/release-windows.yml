name: Release desktop app (Windows)

# Dedicated Windows build — kept SEPARATE from release-desktop.yml (macOS) on
# purpose, so cutting a Windows installer NEVER rebuilds or clobbers the macOS
# release/DMG. Trigger manually (workflow_dispatch) with the version to attach
# to, or on a `win-v*` tag.
#
# Builds the Electron shell for Windows x64 as an UNSIGNED NSIS installer (.exe)
# and uploads it + the Windows auto-update manifest (latest.yml) to the matching
# GitHub Release. The .exe is the THIN CLIENT — it loads the hosted Vercel app,
# so it is 1:1 with the macOS build by construction. Unsigned → first launch
# shows a SmartScreen "More info -> Run anyway" prompt; installs + runs normally.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build + attach to the v<version> release (e.g. 0.1.230). Blank = package.json version."
        required: false
      dry_run:
        description: "Build + verify only; upload the installer as a workflow artifact instead of touching the release."
        type: boolean
        default: false
  push:
    tags:
      - "win-v*.*.*"

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-win:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Sync version (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.version != ''
        run: npm version "${{ github.event.inputs.version }}" --no-git-tag-version

      - name: Verify native audio module (RtAudio / audify) loads
        # Hardware I/O Phase B (opt-in pro audio driver). NON-BLOCKING: the app
        # degrades to standard capture without it, so a flaky prebuild download
        # must never block a release — but the warning makes the gap visible.
        continue-on-error: true
        run: node -e "const {RtAudio}=require('audify'); new RtAudio(); console.log('audify OK', process.arch)"

      # NDI: the license-gated SDK isn't in the repo. Download NDI's own installer,
      # install it silently (Inno Setup), and build both native addons against
      # Electron's ABI. HARD FAIL if either addon is missing — a Windows installer
      # without NDI must never be published (installs would auto-update into it
      # and silently lose NDI audio in / video out).
      # The SDK is fetched ONCE and kept in the GitHub Actions cache, so later builds
      # reuse the saved copy (no download, no installer). On a cache miss we download
      # NDI's installer and UNPACK it with innoextract, which never shows a UI and so
      # can't hang like a silent install can. Bump the key to pick up a new SDK.
      - name: Restore NDI 6 SDK from cache
        id: ndi-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ndi-sdk
          key: ndi-6-sdk-2026-04-16

      - name: Fetch NDI 6 SDK (cache miss only)
        if: steps.ndi-cache.outputs.cache-hit != 'true'
        shell: pwsh
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = "Stop"
          choco install innoextract -y --no-progress
          $exe = Join-Path $env:RUNNER_TEMP "NDI6SDK.exe"
          Invoke-WebRequest -Uri "https://downloads.ndi.tv/SDK/NDI_SDK/NDI%206%20SDK.exe" -OutFile $exe
          $raw = Join-Path $env:RUNNER_TEMP "ndi-raw"
          innoextract --silent --output-dir $raw $exe
          $lib = Get-ChildItem $raw -Recurse -Filter "Processing.NDI.Lib.x64.lib" | Where-Object { $_.DirectoryName -like "*x64*" } | Select-Object -First 1
          if (-not $lib) { Get-ChildItem $raw -Recurse -Depth 3 | Select-Object FullName; throw "NDI .lib not found in extracted installer" }
          $root = $lib.Directory.Parent.Parent.FullName
          Write-Host "Extracted SDK root: $root"
          Copy-Item -Recurse $root (Join-Path $env:RUNNER_TEMP "ndi-sdk")

      - name: Check NDI 6 SDK layout
        shell: pwsh
        run: |
          $sdk = Join-Path $env:RUNNER_TEMP "ndi-sdk"
          foreach ($f in @("Include\Processing.NDI.Lib.h", "Lib\x64\Processing.NDI.Lib.x64.lib", "Bin\x64\Processing.NDI.Lib.x64.dll")) {
            if (-not (Test-Path (Join-Path $sdk $f))) { Get-ChildItem $sdk | Select-Object FullName; throw "NDI SDK file missing: $f" }
          }
          "NDI_SDK_DIR=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build NDI native addons
        shell: pwsh
        timeout-minutes: 15
        run: |
          npm run ndi:rebuild:win
          foreach ($f in @("native\ndi-receiver\build\Release\ndi_receiver.node", "native\ndi-sender\build\Release\ndi_sender.node")) {
            if (-not (Test-Path $f)) { throw "NDI addon missing: $f" }
          }

      # Blackmagic embedded audio (native/decklink-audio). The Desktop Video SDK is
      # Blackmagic-licensed and this repo is PUBLIC, so the zip lives as a release
      # asset in the PRIVATE benji-ss1/presentflow-build-deps repo, read with the
      # BUILD_DEPS_TOKEN secret (fine-grained PAT, Contents: read on that repo only).
      # Skipped cleanly when the secret isn't set — the installer still ships with
      # USB/ASIO audio; only Blackmagic audio is missing.
      - name: Fetch Blackmagic Desktop Video SDK (private)
        env:
          BUILD_DEPS_TOKEN: ${{ secrets.BUILD_DEPS_TOKEN }}
          GH_TOKEN: ${{ secrets.BUILD_DEPS_TOKEN }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:BUILD_DEPS_TOKEN) { Write-Host "::warning::BUILD_DEPS_TOKEN not set - installer ships without Blackmagic audio"; exit 0 }
          $dir = Join-Path $env:RUNNER_TEMP "decklink"
          gh release download decklink-sdk-16.0 --repo benji-ss1/presentflow-build-deps --pattern "*.zip" --dir $dir
          $zip = Get-ChildItem $dir -Filter *.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath $dir -Force
          $idl = Get-ChildItem $dir -Recurse -Filter "DeckLinkAPI.idl" | Where-Object { $_.DirectoryName -like "*Win*include*" } | Select-Object -First 1
          if (-not $idl) { throw "DeckLinkAPI.idl not found in SDK zip" }
          "DECKLINK_SDK_DIR=$($idl.Directory.Parent.Parent.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # node-gyp 13 (knows the runner's current Visual Studio) needs Node 22+,
      # so this one step runs on Node 22; Node 20 is restored right after.
      - name: Use Node 22 for the Blackmagic addon build
        if: env.DECKLINK_SDK_DIR != ''
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build Blackmagic audio addon
        if: env.DECKLINK_SDK_DIR != ''
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set VSDIR=%%i
          call "%VSDIR%\VC\Auxiliary\Build\vcvars64.bat"
          call npm run decklink:rebuild:win
          if not exist native\decklink-audio\build\Release\decklink_audio.node (echo Blackmagic addon missing & exit /b 1)

      - name: Restore Node 20
        if: env.DECKLINK_SDK_DIR != ''
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Compile Electron main
        run: npm run electron:build:tsc

      - name: Build Windows NSIS installer (unsigned)
        # No CSC_* / signing cert — electron-builder produces an unsigned
        # installer. Intentional for the pilot (SmartScreen "Run anyway").
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Verify NDI is packaged
        shell: pwsh
        run: |
          $base = "release\win-unpacked\resources\native"
          foreach ($f in @("ndi-receiver\build\Release\ndi_receiver.node", "ndi-receiver\build\Release\Processing.NDI.Lib.x64.dll", "ndi-sender\build\Release\ndi_sender.node", "ndi-sender\build\Release\Processing.NDI.Lib.x64.dll")) {
            if (-not (Test-Path (Join-Path $base $f))) { throw "Packaged NDI file missing: $f" }
          }
          Write-Host "NDI packaged OK"

      - name: Upload installer as workflow artifact (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          name: presentflow-windows-installer
          path: |
            release/*.exe
            release/latest.yml
          retention-days: 7

      - name: Upload installer + latest.yml to the release
        if: "!(github.event_name == 'workflow_dispatch' && inputs.dry_run)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"

          # Attach to the existing macOS release for this version; create it if
          # this Windows build is the first artifact for the tag.
          # `|| true` so a concurrent macOS run creating the tag first can't
          # abort this job under `set -e`.
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --generate-notes || true

          echo "→ release artifacts:"
          ls -lh release/*.exe release/latest.yml || { echo "::error::Windows artifacts missing"; ls -la release || true; exit 1; }

          # Artifact is PresentFlow-Setup-<ver>.exe (no spaces); glob catches it.
          gh release upload "$TAG" release/*.exe --clobber
          gh release upload "$TAG" release/*.exe.blockmap --clobber || true
          gh release upload "$TAG" release/latest.yml --clobber

      # Installers are ALSO published to the public, code-free
      # benji-ss1/presentflow-releases repo — that's where the dashboard download
      # links and the apps' auto-updater look, so the main code repo can go
      # private. RELEASES_REPO_TOKEN = fine-grained PAT, Contents: read+write on
      # presentflow-releases only. Fails loudly if missing: a release that only
      # lands in the old repo would be invisible to downloads + auto-update.
      - name: Mirror installer + latest.yml to presentflow-releases
        if: "!(github.event_name == 'workflow_dispatch' && inputs.dry_run)"
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then echo "::error::RELEASES_REPO_TOKEN secret is missing"; exit 1; fi
          R=benji-ss1/presentflow-releases
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          gh release view "$TAG" -R "$R" >/dev/null 2>&1 || gh release create "$TAG" -R "$R" --title "PresentFlow $TAG" --notes "PresentFlow desktop $TAG" || true
          gh release upload "$TAG" -R "$R" release/*.exe --clobber
          gh release upload "$TAG" -R "$R" release/*.exe.blockmap --clobber || true
          gh release upload "$TAG" -R "$R" release/latest.yml --clobber
          gh release view "$TAG" -R "$R" --json assets -q '.assets[].name'

