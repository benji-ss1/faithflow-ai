name: Release desktop app

# Fires when a version tag is pushed (e.g. `git tag v0.1.4 && git push --tags`).
# Builds the Electron shell for BOTH Apple Silicon and Intel Macs. The signed
# arm64 zip remains the auto-update artifact; both DMGs are attached so the
# website can offer a direct installer for either architecture.
#
# Manual trigger also supported via workflow_dispatch — enter the version
# without the v prefix.
#
# The .app is the THIN CLIENT — no Next build, no bundled secrets. All the
# UI/API lives on Vercel and updates instantly on git push to main.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.1.4). Leave blank to reuse package.json version."
        required: false

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14 # Apple Silicon runner
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Sync version (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.version != ''
        run: npm version "${{ github.event.inputs.version }}" --no-git-tag-version

      - name: Verify native audio module (RtAudio / audify) loads
        # Hardware I/O Phase B (opt-in pro audio driver). NON-BLOCKING: the app
        # degrades to standard capture without it, so a flaky prebuild download
        # must never block a release — but the warning makes the gap visible.
        continue-on-error: true
        run: node -e "const {RtAudio}=require('audify'); new RtAudio(); console.log('audify OK', process.arch)"

      - name: Make audify universal (arm64 + x64, pinned sha256)
        # prebuild-install fetches the HOST arch only; both DMGs share one
        # node_modules, so lipo both prebuilds together.
        continue-on-error: true
        run: bash scripts/audify-universal.sh

      # Blackmagic embedded audio — same private-SDK pattern as release-windows.yml.
      - name: Fetch Blackmagic Desktop Video SDK (private)
        env:
          BUILD_DEPS_TOKEN: ${{ secrets.BUILD_DEPS_TOKEN }}
          GH_TOKEN: ${{ secrets.BUILD_DEPS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${BUILD_DEPS_TOKEN:-}" ]; then echo "::warning::BUILD_DEPS_TOKEN not set - DMG ships without Blackmagic audio"; exit 0; fi
          D="$RUNNER_TEMP/decklink"; mkdir -p "$D"
          gh release download decklink-sdk-16.0 --repo benji-ss1/presentflow-build-deps --pattern "*.zip" --dir "$D"
          unzip -q "$D"/*.zip -d "$D"
          H="$(find "$D" -path "*Mac/include/DeckLinkAPI.h" | head -1)"
          [ -n "$H" ] || { echo "DeckLinkAPI.h not found in SDK zip"; exit 1; }
          echo "DECKLINK_SDK_DIR=$(dirname "$(dirname "$(dirname "$H")")")" >> "$GITHUB_ENV"

      - name: Build Blackmagic audio addon (universal)
        if: env.DECKLINK_SDK_DIR != ''
        run: |
          npm run decklink:rebuild
          lipo -info native/decklink-audio/build/Release/decklink_audio.node

      - name: Compile Electron main
        run: npm run electron:build:tsc

      - name: Build both Mac installers (no publish yet — need to ad-hoc sign first)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac dmg zip --arm64 --x64 --publish never

      - name: Check packaged audio driver architectures (warn only)
        continue-on-error: true
        run: |
          for app in release/mac-arm64/*.app release/mac/*.app; do
            f="$app/Contents/Resources/app.asar.unpacked/node_modules/audify/build/Release/audify.node"
            [ -f "$f" ] && lipo -info "$f" || echo "::warning::audify.node missing in $app (pro audio driver unavailable in that build)"
          done

      - name: Ad-hoc codesign the .app + repack zip
        # macOS Squirrel (electron-updater's mac install path) refuses to swap
        # in an *unsigned* update — the old app's install helper checks the
        # downloaded .app's signature and rejects anything without one. Since
        # we don't have an Apple Developer cert, apply an ad-hoc (identity="-")
        # signature: no notarization, no Gatekeeper trust, but valid enough
        # for Squirrel's SecCodeCheckValidity gate to pass.
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          APP="release/mac-arm64/Present Flow.app"
          ZIP="release/Present-Flow-${VERSION}-arm64-mac.zip"
          BLOCKMAP="release/Present-Flow-${VERSION}-arm64-mac.zip.blockmap"

          if [ ! -d "$APP" ]; then
            echo "::error::App bundle not found at $APP"
            ls -la release release/mac-arm64 || true
            exit 1
          fi

          echo "→ ad-hoc signing $APP"
          codesign --deep --force --sign - --timestamp=none "$APP"
          echo "→ verifying signature"
          codesign --verify --verbose=2 "$APP"

          echo "→ repacking zip"
          rm -f "$ZIP" "$BLOCKMAP"
          cd "release/mac-arm64"
          # ditto preserves resource forks + xattrs — required for macOS
          # to treat the extracted .app as valid.
          ditto -c -k --sequesterRsrc --keepParent "Present Flow.app" "../Present-Flow-${VERSION}-arm64-mac.zip"
          cd -
          ls -lh "$ZIP"

      - name: Upload installers + generate latest-mac.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          ZIP="release/Present-Flow-${VERSION}-arm64-mac.zip"
          ARM_DMG="release/Present-Flow-${VERSION}-arm64-mac.dmg"
          INTEL_DMG="release/Present-Flow-${VERSION}-x64-mac.dmg"
          TAG="v${VERSION}"

          # Create GH Release if it doesn't exist (workflow_dispatch path).
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --generate-notes

          # Upload the freshly-signed zip.
          gh release upload "$TAG" "$ZIP" --clobber

          # Direct-download installers. Intel Macs must receive x64; Apple
          # Silicon Macs receive arm64. They are intentionally separate,
          # never a misleading single generic "Mac" download.
          test -f "$ARM_DMG"
          test -f "$INTEL_DMG"
          gh release upload "$TAG" "$ARM_DMG" "$INTEL_DMG" --clobber

          # Reconstruct latest-mac.yml from the SIGNED zip (sha512 changed).
          SHA=$(shasum -a 512 "$ZIP" | awk '{print $1}' | xxd -r -p | base64)
          SIZE=$(stat -f%z "$ZIP")
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")
          cat > release/latest-mac.yml <<EOF
          version: ${VERSION}
          files:
            - url: Present-Flow-${VERSION}-arm64-mac.zip
              sha512: ${SHA}
              size: ${SIZE}
          path: Present-Flow-${VERSION}-arm64-mac.zip
          sha512: ${SHA}
          releaseDate: '${DATE}'
          EOF
          gh release upload "$TAG" release/latest-mac.yml --clobber

      # Installers are ALSO published to the public, code-free
      # benji-ss1/presentflow-releases repo — that's where the dashboard download
      # links and the apps' auto-updater look, so the main code repo can go
      # private. RELEASES_REPO_TOKEN = fine-grained PAT, Contents: read+write on
      # presentflow-releases only. Fails loudly if missing: a release that only
      # lands in the old repo would be invisible to downloads + auto-update.
      - name: Mirror installers + latest-mac.yml to presentflow-releases
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then echo "::error::RELEASES_REPO_TOKEN secret is missing"; exit 1; fi
          R=benji-ss1/presentflow-releases
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          gh release view "$TAG" -R "$R" >/dev/null 2>&1 || gh release create "$TAG" -R "$R" --title "PresentFlow $TAG" --notes "PresentFlow desktop $TAG" || true
          gh release upload "$TAG" -R "$R" "release/Present-Flow-${VERSION}-arm64-mac.zip" "release/Present-Flow-${VERSION}-arm64-mac.dmg" "release/Present-Flow-${VERSION}-x64-mac.dmg" release/latest-mac.yml --clobber
          gh release view "$TAG" -R "$R" --json assets -q '.assets[].name'

