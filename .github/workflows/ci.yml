name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

  tests:
    name: Tests (offline suite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install
        run: npm ci --no-audit --no-fund

      # Runs every test file listed in test/suites/ci.txt (pure tests, no DB or
      # API keys). A failing or hung file fails the PR. Tests that need a DB or
      # are known-broken on main live in test/suites/known-failing.txt.
      - name: Test
        run: npm run test:ci

  changes:
    name: What's New entry (changes/*.md)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Fails when src/ changed without a valid changes/<slug>.md or a
      # "no-user-change" marker (own line / PR label), when a newly added
      # note's version isn't above the merge base's newest, or when
      # changelog.generated.ts is stale. See changes/README.md.
      - name: Check changes entry
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: npm run check:changes

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npx next lint --max-warnings=0
        # Non-blocking for now — the codebase has legacy lint noise the
        # main-branch cleanup should catch up on. Flip to `continue-on-error:
        # false` once the baseline is clean.
        continue-on-error: true
