name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  staleness:
    name: Branch freshness
    # A branch that drifts far behind main is how shipped work gets reverted
    # (CLAUDE.md rule 0). One PR reached 585 commits behind, which meant its
    # changes had to be re-applied onto main by hand, with 5 files conflicting.
    # Fail loudly at ~150 commits so a rebase happens while it is still cheap.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: How far behind main?
        run: |
          git fetch origin main --quiet
          BEHIND=$(git rev-list --count HEAD..origin/main)
          AHEAD=$(git rev-list --count origin/main..HEAD)
          echo "This branch is $BEHIND commit(s) behind main and $AHEAD ahead."
          echo "### Branch freshness" >> "$GITHUB_STEP_SUMMARY"
          echo "- behind main: **$BEHIND**" >> "$GITHUB_STEP_SUMMARY"
          echo "- ahead of main: **$AHEAD**" >> "$GITHUB_STEP_SUMMARY"
          if [ "$BEHIND" -gt 150 ]; then
            echo "::error::This branch is $BEHIND commits behind main. Merge main in (git fetch origin && git merge origin/main) before shipping, or you risk reverting work that landed meanwhile."
            exit 1
          fi
          if [ "$BEHIND" -gt 40 ]; then
            echo "::warning::This branch is $BEHIND commits behind main — merge main in soon."
          fi

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

  tests:
    name: Tests (offline suite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install
        run: npm ci --no-audit --no-fund

      # Runs every test file listed in test/suites/ci.txt (pure tests, no DB or
      # API keys). A failing or hung file fails the PR. Tests that need a DB or
      # are known-broken on main live in test/suites/known-failing.txt.
      - name: Test
        run: npm run test:ci

  db-tests:
    name: Tests (database)
    runs-on: ubuntu-latest
    # The adversarial cross-church suites prove one church cannot see another's
    # data. Until 2026-09-22 they were in known-failing.txt purely because CI
    # had no Postgres — i.e. the tests we most wanted green were the ones that
    # never ran. This job exists to close that.
    services:
      postgres:
        # pgvector, not plain postgres: the schema has vector(384) columns for
        # sermon/semantic search and `drizzle-kit push` fails without it.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: faithflow_test
          # No password AT ALL, rather than a throwaway one. This database
          # exists for ~3 minutes inside the runner and is not reachable from
          # outside it, so a password buys nothing — but a password in a
          # committed connection string is indistinguishable from a real leak to
          # a scanner (GitGuardian flagged exactly that here), and normalising
          # those is how a real leak eventually gets waved through.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/faithflow_test
      # These suites seed and delete ephemeral churches, so running them in
      # parallel makes them fight over the same rows.
      TEST_CONCURRENCY: "1"
      # The pool's 45s idle timeout keeps node alive long after a test's
      # assertions finish — it made every file take ~45s of pure waiting, and
      # the whole suite ~8 minutes. 500ms brings it to ~1s per file.
      PG_IDLE_TIMEOUT_MS: "500"
      # desktop-signin runs 1000 race iterations against a real database and
      # genuinely needs ~150s. That is real work, not a hang, and it is the test
      # that proves a password reset kills every in-flight device exchange.
      TEST_TIMEOUT_MS: "300000"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install
        run: npm ci --no-audit --no-fund

      # Generated per run, never committed. An earlier version hardcoded a
      # dummy literal here and GitGuardian flagged it — correctly: a
      # secret-shaped string in a workflow file is indistinguishable from a real
      # leak to a scanner, and normalising them is how real ones get ignored.
      - name: Generate a throwaway AUTH_SECRET
        run: echo "AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Enable pgvector
        run: psql "$DATABASE_URL" -c 'CREATE EXTENSION IF NOT EXISTS vector;'

      - name: Create the schema
        # push, not migrate: this is a throwaway DB that only needs to match
        # schema.ts, and push keeps the job independent of migration history.
        run: npx drizzle-kit push --force

      - name: Test (database)
        run: npm run test:db

  changes:
    name: What's New entry (changes/*.md)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Fails when src/ changed without a valid changes/<slug>.md or a
      # "no-user-change" marker (own line / PR label), when a newly added
      # note's version isn't above the merge base's newest, or when
      # changelog.generated.ts is stale. See changes/README.md.
      - name: Check changes entry
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: npm run check:changes

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npx next lint --max-warnings=0
        # Non-blocking for now — the codebase has legacy lint noise the
        # main-branch cleanup should catch up on. Flip to `continue-on-error:
        # false` once the baseline is clean.
        continue-on-error: true
