name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  staleness:
    name: Branch freshness
    # A branch that drifts far behind main is how shipped work gets reverted
    # (CLAUDE.md rule 0). One PR reached 585 commits behind, which meant its
    # changes had to be re-applied onto main by hand, with 5 files conflicting.
    # Fail loudly at ~150 commits so a rebase happens while it is still cheap.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: How far behind main?
        run: |
          git fetch origin main --quiet
          BEHIND=$(git rev-list --count HEAD..origin/main)
          AHEAD=$(git rev-list --count origin/main..HEAD)
          echo "This branch is $BEHIND commit(s) behind main and $AHEAD ahead."
          echo "### Branch freshness" >> "$GITHUB_STEP_SUMMARY"
          echo "- behind main: **$BEHIND**" >> "$GITHUB_STEP_SUMMARY"
          echo "- ahead of main: **$AHEAD**" >> "$GITHUB_STEP_SUMMARY"
          if [ "$BEHIND" -gt 150 ]; then
            echo "::error::This branch is $BEHIND commits behind main. Merge main in (git fetch origin && git merge origin/main) before shipping, or you risk reverting work that landed meanwhile."
            exit 1
          fi
          if [ "$BEHIND" -gt 40 ]; then
            echo "::warning::This branch is $BEHIND commits behind main — merge main in soon."
          fi

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

  tests:
    name: Tests (offline suite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install
        run: npm ci --no-audit --no-fund

      # Runs every test file listed in test/suites/ci.txt (pure tests, no DB or
      # API keys). A failing or hung file fails the PR. Tests that need a DB or
      # are known-broken on main live in test/suites/known-failing.txt.
      - name: Test
        run: npm run test:ci

  changes:
    name: What's New entry (changes/*.md)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Fails when src/ changed without a valid changes/<slug>.md or a
      # "no-user-change" marker (own line / PR label), when a newly added
      # note's version isn't above the merge base's newest, or when
      # changelog.generated.ts is stale. See changes/README.md.
      - name: Check changes entry
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: npm run check:changes

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npx next lint --max-warnings=0
        # Non-blocking for now — the codebase has legacy lint noise the
        # main-branch cleanup should catch up on. Flip to `continue-on-error:
        # false` once the baseline is clean.
        continue-on-error: true
